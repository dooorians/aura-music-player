// Types the Compose compiler is told to treat as stable, so a composable taking them is skipped when it is handed an
// equal value, not only the very same instance.
//
// The read-only collection interfaces: the UI is only ever handed lists, sets and maps that nobody changes afterwards
// (view models publish a new one when the content changes). Without this the compiler cannot know it, and with strong
// skipping it compares them by identity: a list rebuilt with the same content (a flow mapping a query again, a copy of a
// UI state) recomposed every composable that took it. Compared with equals, the check is O(1) for the same instance and
// only walks the elements when it is a new one.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection

// android.net.Uri is immutable (its documentation says so), but it is a platform class the compiler cannot look into.
android.net.Uri
