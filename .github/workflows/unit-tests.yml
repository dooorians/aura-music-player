name: Unit tests

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

# A newer push to the same branch or PR replaces the run still going.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The QA variant reads the short HEAD at configuration time.
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches the wrapper and dependencies between runs; the runner's Android SDK has its licences accepted, so AGP
      # installs the platform and NDK the build declares on its own.
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
