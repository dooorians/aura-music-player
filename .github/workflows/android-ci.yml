name: Android CI

on:
  push:
    branches: [feat/algo-v2, main]
  pull_request:
    branches: [feat/algo-v2, main]

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app compiles to Java 17 (compileOptions in app/build.gradle.kts).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The runner ships an Android SDK; the exact pieces this build asks for are installed explicitly:
      # compileSdk 37, the NDK and CMake of the Automix analyser's C++ (ndkVersion and externalNativeBuild).
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
